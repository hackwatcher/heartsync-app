name: heartsync
description: "HeartSync - Long Distance Relationship App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  glassmorphism: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_inappwebview: ^6.0.0
  flutter_webrtc: ^0.12.0
  socket_io_client: ^3.1.4
  font_awesome_flutter: ^10.7.0
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  connectivity_plus: ^6.1.1
  path_provider: ^2.1.5
  path: ^1.9.0
  video_player: ^2.11.1
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: 6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
